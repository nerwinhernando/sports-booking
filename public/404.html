<!DOCTYPE html>
<html>
<head>
  <title>Venue Not Found (404)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      padding: 0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      padding: 40px;
    }

    h1 {
      font-size: 120px;
      margin: 0;
      font-weight: 900;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    h2 {
      font-size: 32px;
      margin: 20px 0;
      font-weight: 600;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.9;
      margin: 20px 0;
    }

    .button {
      display: inline-block;
      background: white;
      color: #667eea;
      padding: 15px 40px;
      margin: 30px 10px;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .icon {
      font-size: 80px;
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">🏸</div>
    <h1>404</h1>
    <h2>Venue Not Found</h2>
    <p>
      The badminton venue you're looking for doesn't exist or is no longer available.
      This could mean the venue URL is incorrect or the venue has been deactivated.
    </p>
    <div>
      <a href="http://localhost:3000" class="button">🏠 Go to Home</a>
      <a href="http://localhost:3000/search" class="button">🔍 Search Venues</a>
    </div>
  </div>
</body>
</html>
